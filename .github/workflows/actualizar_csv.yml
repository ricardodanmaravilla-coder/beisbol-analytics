name: Actualizar CSV de MLB Diario

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          pip install requests pandas numpy

      - name: Ejecutar motor de descarga
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python descargar_historico_mlb.py

      - name: Guardar los cambios (Commit y Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Automatización: Histórico de MLB actualizado" || echo "Sin cambios nuevos para guardar"
          git push
